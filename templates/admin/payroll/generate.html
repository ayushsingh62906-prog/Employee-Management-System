{% extends "base/base.html" %}

{% block title %}Generate Salary{% endblock %}
{% block page_title %}Generate Salary{% endblock %}

{% block content %}

<div class="page-card">
    <div class="page-card-header">
        <div>
            <h4>Generate Salary</h4>
            <p style="color:var(--text-secondary); margin-top:6px;">Select employee and month to generate payslip</p>
        </div>
    </div>

    <form method="POST" class="form-grid">
        <div class="form-group">
            <label>Employee <span class="required">*</span></label>
            <select name="employee_id" required>
                <option value="">Select Employee</option>
                {% for emp in employee_list %}
                    <option value="{{ emp.employee_id }}">
                        {{ emp.full_name }} ({{ emp.employee_id }}) - CTC: ₹{{ "{:,.0f}".format(emp.salary or 0) }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Month <span class="required">*</span></label>
            <input type="month" name="month" value="{{ current_month }}" required>
        </div>

        <div class="form-actions full-width">
            <button type="submit" class="btn-ems btn-ems-primary">
                <i class="fas fa-calculator"></i> Generate Payslip
            </button>
            <a href="{{ url_for('payroll.list_payroll') }}" class="btn-ems btn-ems-outline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
