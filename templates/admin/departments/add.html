{% extends "base/base.html" %}

{% block title %}Add Department{% endblock %}
{% block page_title %}Add Department{% endblock %}

{% block content %}

<div class="page-card">
    <div class="page-card-header">
        <div>
            <h4>Add New Department</h4>
            <p style="color:var(--text-secondary); margin-top:6px; font-size:14px;">
                Create a new department for your organization.
            </p>
        </div>
    </div>

    <form method="POST" class="form-grid" style="margin-top:10px;">

        <div class="form-group">
            <label>Department Name <span class="required">*</span></label>
            <input type="text" name="name" required placeholder="e.g. Human Resources">
        </div>

        <div class="form-group">
            <label>Head of Department</label>
            <input type="text" name="head" placeholder="e.g. Rahul Sharma">
        </div>

        <div class="form-group">
            <label>Location / Floor</label>
            <input type="text" name="location" placeholder="e.g. 3rd Floor, Block A">
        </div>
        <div class="form-group">
    <label>Annual Budget (₹)</label>
    <input type="number" name="budget" min="0" step="1000" placeholder="e.g. 500000">
</div>

        <div class="form-group full-width">
            <label>Description</label>
            <textarea name="description" rows="4" placeholder="Short description about this department..."></textarea>
        </div>

        <div class="form-actions full-width">
            <button type="submit" class="btn-ems btn-ems-primary">
                <i class="fas fa-save"></i> Save Department
            </button>
            <a href="{{ url_for('departments.list_departments') }}" class="btn-ems btn-ems-outline">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
