{% extends "base/base.html" %}

{% block title %}New Announcement{% endblock %}
{% block page_title %}New Announcement{% endblock %}

{% block content %}

<div class="page-card">
    <div class="page-card-header">
        <h4>Post New Announcement</h4>
    </div>

    <form method="POST" class="form-grid">
        <div class="form-group full-width">
            <label>Title <span class="required">*</span></label>
            <input type="text" name="title" required placeholder="e.g. Holiday Notice">
        </div>

        <div class="form-group full-width">
            <label>Message <span class="required">*</span></label>
            <textarea name="message" rows="5" required placeholder="Write the announcement..."></textarea>
        </div>

        <div class="form-actions full-width">
            <button type="submit" class="btn-ems btn-ems-primary">
                <i class="fas fa-bullhorn"></i> Post Announcement
            </button>
            <a href="{{ url_for('announcements.list_announcements') }}" class="btn-ems btn-ems-outline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
