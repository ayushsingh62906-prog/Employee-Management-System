{% extends "base/base.html" %}

{% block title %}Mark Attendance{% endblock %}
{% block page_title %}Mark Attendance{% endblock %}

{% block content %}

<div class="page-card">

    <div class="page-card-header">
        <div>
            <h4>Mark Attendance</h4>
            <p style="color:var(--text-secondary); margin-top:6px; font-size:14px;">
                Manually mark or update attendance for any employee.
            </p>
        </div>
    </div>

    <form method="POST" class="form-grid" style="margin-top:10px;">

        <!-- Employee Select -->
        <div class="form-group">
            <label>Employee <span class="required">*</span></label>
            <select name="employee_id" required>
                <option value="">Select Employee</option>
                {% for emp in employee_list %}
                    <option value="{{ emp.employee_id }}">
                        {{ emp.full_name }} ({{ emp.employee_id }}) - {{ emp.department }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Date -->
        <div class="form-group">
            <label>Date <span class="required">*</span></label>
            <input type="date" name="date" value="{{ today }}" required>
        </div>

        <!-- Status -->
        <div class="form-group">
            <label>Status <span class="required">*</span></label>
            <select name="status" required>
               <option value="Present">Present</option>
<option value="Absent">Absent</option>
<option value="Late">Late</option>
<option value="Half Day">Half Day</option>
<option value="Overtime">Overtime</option>
<option value="On Leave">On Leave</option>
            </select>
        </div>

        <!-- Check In -->
        <div class="form-group">
            <label>Check In Time</label>
            <input type="time" name="check_in">
        </div>

        <!-- Check Out -->
        <div class="form-group">
            <label>Check Out Time</label>
            <input type="time" name="check_out">
        </div>

        <!-- Remarks -->
        <div class="form-group full-width">
            <label>Remarks</label>
            <textarea name="remarks" rows="3" placeholder="Any notes (optional)"></textarea>
        </div>

        <!-- Actions -->
        <div class="form-actions full-width">
            <button type="submit" class="btn-ems btn-ems-primary">
                <i class="fas fa-save"></i> Save Attendance
            </button>
            <a href="{{ url_for('attendance.list_attendance') }}" class="btn-ems btn-ems-outline">
                Cancel
            </a>
        </div>

    </form>
</div>

{% endblock %}
