<!-- ==========================================================
     FILE : templates/admin/employees/add.html
     PURPOSE : Add New Employee
=========================================================== -->

{% extends "base/base.html" %}

{% block title %}Add Employee{% endblock %}
{% block page_title %}Add Employee{% endblock %}

{% block content %}

<div class="dashboard-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
    <div>
        <h2>Add New Employee</h2>
        <p>Fill in the details below to onboard a new employee.</p>
    </div>

    <a href="{{ url_for('employees.list_employees') }}" class="btn-ems btn-ems-outline">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>
<div class="page-card">

    <form method="POST" action="{{ url_for('employees.add_employee') }}" enctype="multipart/form-data">

        <!-- ============ PHOTO ============ -->

        <div class="form-group full-width" style="margin-bottom:20px;">
            <label>Profile Photo</label>
            <div class="photo-upload-box">
                <img id="photoPreview" src="{{ url_for('static', filename='images/user.png') }}">
                <input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)">
            </div>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" name="full_name" required placeholder="e.g. Rahul Sharma">
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email" required placeholder="rahul@company.com">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="+91 98765 43210">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob">
            </div>

            <div class="form-group">
    <label>Department *</label>
    <select name="department" id="departmentSelect" required>
        <option value="">Select Department</option>
        {% for dept in departments_list %}
            <option value="{{ dept }}">{{ dept }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label>Designation *</label>
    <select name="designation" id="designationSelect" required>
        <option value="">Select Department first</option>
    </select>
</div>

            <div class="form-group">
                <label>Employee Type</label>
                <select name="employee_type">
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Intern">Intern</option>
                    <option value="Contract">Contract</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date of Joining</label>
                <input type="date" name="date_of_joining">
            </div>

            <div class="form-group">
                <label>Monthly Salary (₹)</label>
                <input type="number" name="salary" min="0" step="0.01" placeholder="e.g. 45000">
            </div>

            <div class="form-group full-width">
                <label>Address</label>
                <textarea name="address" rows="3" placeholder="Full address"></textarea>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn-ems btn-ems-primary">
                <i class="fa-solid fa-check"></i> Save Employee
            </button>
            <a href="{{ url_for('employees.list_employees') }}" class="btn-ems btn-ems-outline">
                Cancel
            </a>
        </div>

    </form>

</div>

<script>
const designationMap = {{ designation_map | tojson }};

const deptSelect = document.getElementById("departmentSelect");
const desigSelect = document.getElementById("designationSelect");

deptSelect.addEventListener("change", function () {
    const dept = this.value;
    desigSelect.innerHTML = '<option value="">Select Designation</option>';

    if (dept && designationMap[dept]) {
        designationMap[dept].forEach(function (d) {
            const opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            desigSelect.appendChild(opt);
        });
    } else if (dept) {
        // Agar map me nahi hai to generic options
        ["Executive", "Senior Executive", "Manager", "Team Lead"].forEach(function (d) {
            const opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            desigSelect.appendChild(opt);
        });
    }
});
function previewPhoto(input) {
    if (input.files && input.files[0]) {
        document.getElementById('photoPreview').src = URL.createObjectURL(input.files[0]);
    }
}
</script>

{% endblock %}
