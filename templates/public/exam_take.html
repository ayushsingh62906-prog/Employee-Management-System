<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Assessment - {{ job_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Exam page ke liye wider container chahiye, auth-box
           narrow (520px) hai jo 60 questions ke liye kaafi nahi */
        .exam-container {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }

        .exam-header {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
        }

        .exam-header h2 {
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .exam-header p {
            color: var(--text-secondary);
        }

        .exam-question-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .exam-question-card .q-number {
            display: inline-block;
            background: rgba(99,102,241,.12);
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .exam-question-card .q-text {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .exam-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: .2s;
        }

        .exam-option:hover {
            border-color: var(--primary);
            background: rgba(99,102,241,.06);
        }

        .exam-option input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .exam-option span {
            color: var(--text-primary);
            font-size: 14px;
        }

        .exam-submit-bar {
            position: sticky;
            bottom: 20px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }
    </style>
</head>
<body class="auth-body">

    <div class="exam-container">

        <div class="exam-header">
            <h2><i class="fas fa-file-signature"></i> Online Assessment</h2>
            <p>{{ job_title }} &middot; {{ candidate_name }}</p>
            <p style="font-size:13px; margin-top:8px;">
                {{ questions|length }} Questions &middot; Answer all before submitting
            </p>
        </div>

        <form method="POST" action="{{ url_for('exam.submit_exam', token=token) }}"
              onsubmit="return confirm('Are you sure you want to submit? You cannot retake this exam.');">

            {% for q in questions %}
            <div class="exam-question-card">

                <span class="q-number">Question {{ loop.index }} of {{ questions|length }}</span>
                <div class="q-text">{{ q.question }}</div>

                {% for option in q.options %}
                <label class="exam-option">
                    <input type="radio" name="question_{{ q._id }}" value="{{ loop.index0 }}" required>
                    <span>{{ option }}</span>
                </label>
                {% endfor %}

            </div>
            {% endfor %}

            <div class="exam-submit-bar">
                <button type="submit" class="btn-auth">
                    <i class="fas fa-check-circle"></i> Submit Assessment
                </button>
            </div>

        </form>

    </div>

</body>
</html>
