<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - EMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:var(--bg-color);">

    <div style="width:100%; max-width:420px; background:var(--surface-color); border:1px solid var(--border-color); border-radius:18px; padding:35px;">

        <h2 style="text-align:center; margin-bottom:8px;">Set Your Password</h2>
        <p style="text-align:center; color:var(--text-secondary); margin-bottom:30px; font-size:14px;">
            Enter your Employee ID and Email to set password for the first time.
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="background: {% if category == 'success' %}#166534{% elif category == 'danger' %}#7f1d1d{% else %}#1e3a5f{% endif %}; 
                                color:white; padding:12px 16px; border-radius:8px; margin-bottom:20px; font-size:14px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div style="margin-bottom:18px;">
                <label style="display:block; margin-bottom:6px; font-size:14px;">Employee ID</label>
                <input type="text" name="employee_id" required placeholder="e.g. EMP0001"
                       style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border-color); background:#0a0a0a; color:white;">
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; margin-bottom:6px; font-size:14px;">Email</label>
                <input type="email" name="email" required placeholder="your.email@company.com"
                       style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border-color); background:#0a0a0a; color:white;">
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; margin-bottom:6px; font-size:14px;">New Password</label>
                <input type="password" name="password" required placeholder="Minimum 6 characters"
                       style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border-color); background:#0a0a0a; color:white;">
            </div>

            <div style="margin-bottom:25px;">
                <label style="display:block; margin-bottom:6px; font-size:14px;">Confirm Password</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter password"
                       style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border-color); background:#0a0a0a; color:white;">
            </div>

            <button type="submit" style="width:100%; padding:13px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
                Set Password
            </button>
        </form>

        <p style="text-align:center; margin-top:25px; font-size:14px; color:var(--text-secondary);">
            Already set password? <a href="{{ url_for('login') }}" style="color:var(--primary);">Login here</a>
        </p>
    </div>

</body>
</html>
