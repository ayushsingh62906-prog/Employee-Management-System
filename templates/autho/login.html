<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EMS Pro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">

<div class="auth-box">

    <div class="auth-logo">
        <i class="fas fa-briefcase"></i>
        <h2>EMS Pro</h2>
        <p>Sign in to your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="auth-flash auth-flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" class="auth-form">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="you@company.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn-auth">Login</button>
    </form>

    <div class="auth-links">
        <p>First time employee? <a href="{{ url_for('set_password') }}">Set Password</a></p>
        <p>Admin / HR? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>

    <div class="back-home">
        <a href="{{ url_for('home') }}"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

</div>

</body>
</html>
