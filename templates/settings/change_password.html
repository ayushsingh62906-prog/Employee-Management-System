{% extends "base/base.html" %}

{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<!-- ============ SETTINGS TABS (Profile / Password) ============ -->
<div style="display:flex; gap:12px; margin-bottom:20px;">

    <a href="{{ url_for('settings.update_profile') }}"
       class="btn-ems {{ 'btn-ems-primary' if request.endpoint == 'settings.update_profile' else 'btn-ems-outline' }}">
        <i class="fa-solid fa-user"></i> Profile
    </a>

    <a href="{{ url_for('settings.change_password') }}"
       class="btn-ems {{ 'btn-ems-primary' if request.endpoint == 'settings.change_password' else 'btn-ems-outline' }}">
        <i class="fa-solid fa-lock"></i> Change Password
    </a>

</div>
<div class="page-card" style="max-width:500px;">
    <div class="page-card-header">
        <h4>Change Password</h4>
    </div>

    <form method="POST" class="form-grid" style="grid-template-columns:1fr;">
        <div class="form-group">
            <label>Current Password <span class="required">*</span></label>
            <input type="password" name="current_password" required>
        </div>

        <div class="form-group">
            <label>New Password <span class="required">*</span></label>
            <input type="password" name="new_password" required placeholder="Minimum 6 characters">
        </div>

        <div class="form-group">
            <label>Confirm New Password <span class="required">*</span></label>
            <input type="password" name="confirm_password" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-ems btn-ems-primary">
                <i class="fas fa-key"></i> Update Password
            </button>
        </div>
    </form>
</div>

{% endblock %}
