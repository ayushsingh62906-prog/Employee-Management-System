{% extends "base/base.html" %}

{% block title %}Post Job{% endblock %}
{% block page_title %}Post New Job{% endblock %}

{% block content %}

<div class="page-card">
    <div class="page-card-header">
        <div>
            <h4>Post New Job Opening</h4>
        </div>
        <a href="{{ url_for('jobs.list_jobs') }}" class="btn-ems btn-ems-outline">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <form method="POST" class="form-grid" style="margin-top:10px;">
        <div class="form-group">
            <label>Job Title <span class="required">*</span></label>
            <input type="text" name="title" required placeholder="e.g. Software Engineer">
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" name="department" placeholder="e.g. Engineering">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" placeholder="e.g. Bangalore / Remote">
        </div>

        <div class="form-group">
            <label>Job Type</label>
            <select name="job_type">
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Internship">Internship</option>
                <option value="Contract">Contract</option>
            </select>
        </div>

        <div class="form-group">
            <label>Experience Required</label>
            <input type="text" name="experience" placeholder="e.g. 2-4 years">
        </div>

        <div class="form-group full-width">
            <label>Job Description <span class="required">*</span></label>
            <textarea name="description" rows="4" required placeholder="Describe the role..."></textarea>
        </div>

        <div class="form-group full-width">
            <label>Requirements</label>
            <textarea name="requirements" rows="3" placeholder="Skills, qualifications..."></textarea>
        </div>

        <div class="form-actions full-width">
            <button type="submit" class="btn-ems btn-ems-primary">
                <i class="fas fa-paper-plane"></i> Post Job
            </button>
        </div>
    </form>
</div>

{% endblock %}
